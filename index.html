<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Hamker</title>
<script>try{var t=localStorage.getItem('hk-theme')||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light');document.documentElement.dataset.theme=t}catch(e){}</script>
<style>
:root{--k:#000;--w:#fff;--mut:#6b6b6b;--soft:#efefef}
[data-theme=dark]{--k:#fff;--w:#000;--mut:#9a9a9a;--soft:#242424;color-scheme:dark}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
input{-webkit-user-select:text;user-select:text}
html,body{height:100%;overflow:hidden}
body{background:var(--w);color:var(--k);font:17px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button,input{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer}
.i{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;pointer-events:none}
.app{position:relative;max-width:440px;height:100%;margin:auto;display:flex;flex-direction:column;border-inline:2px solid var(--k);overflow:hidden;background:var(--w)}
@media(max-width:440px){.app{border-inline:0}}
header{display:grid;grid-template-columns:44px 1fr 44px;align-items:center;padding:calc(10px + env(safe-area-inset-top,0px)) 14px 10px;border-bottom:2px solid var(--k)}
.logo{text-align:center;font-weight:800;letter-spacing:.35em;text-indent:.35em}
.ib{width:44px;height:44px;border-radius:50%;display:grid;place-items:center}
.ib.on{background:var(--k);color:var(--w)}
main{flex:1;overflow:auto;padding:18px 20px;display:flex;flex-direction:column;gap:12px}
.tt{font-size:26px;font-weight:800;text-align:center;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.top{display:grid;grid-template-columns:44px 1fr 44px;align-items:center}
.st{color:var(--mut);text-align:center;padding:24px 0}
.btn,.seg button{border:2px solid var(--k);border-radius:99px;padding:10px;font-weight:700;width:100%}
.btn.on,.seg button.on{background:var(--k);color:var(--w)}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.row{display:flex;align-items:center;gap:12px;border:2px solid var(--k);border-radius:16px;padding:8px;cursor:pointer}
.row.cur{background:var(--k);color:var(--w)}.row.cur small{color:inherit;opacity:.7}
.th{width:48px;height:48px;flex:none;border:2px solid currentColor;border-radius:12px;background:center/cover var(--soft);display:grid;place-items:center;color:var(--k)}
.rt{flex:1;min-width:0}.rt b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
small{color:var(--mut);font-size:14px;display:block}
.row .ib{width:36px;height:36px;flex:none}
nav{display:grid;grid-template-columns:1fr 1fr 1fr;align-items:center;border-top:2px solid var(--k);padding:6px 0 calc(6px + env(safe-area-inset-bottom,0px))}
nav>button{display:flex;flex-direction:column;align-items:center;gap:2px;opacity:.4;font-size:13px;font-weight:700;height:54px;justify-content:center}
nav>button.on{opacity:1}
nav>.big{opacity:1;width:68px;height:68px;margin:-30px auto 0;border-radius:50%;background:var(--k);color:var(--w);box-shadow:0 0 0 6px var(--w);display:grid;place-items:center}
.big .i{width:32px;height:32px}
.mini{position:relative;display:flex;align-items:center;gap:12px;border-top:2px solid var(--k);padding:10px 20px 6px;cursor:pointer}
.mini i{position:absolute;top:-2px;left:0;height:3px;background:var(--k);width:0}
.mini .th{width:40px;height:40px}
.pp{position:absolute;inset:0;z-index:20;background:var(--w);display:flex;flex-direction:column;transform:translateY(100%);transition:transform .3s;padding-top:env(safe-area-inset-top,0px)}
.pp.on{transform:none}
.ph{display:grid;grid-template-columns:44px 1fr 44px;align-items:center;padding:10px 14px;font-weight:700;text-align:center}
.sc{flex:1;overflow:auto;padding:0 20px 20px}
.pg{min-height:calc(100% - 4px);display:flex;flex-direction:column;justify-content:space-evenly;align-items:center;gap:16px}
.disk{width:min(260px,68vw);aspect-ratio:1;border-radius:50%;border:2px solid var(--k);background:repeating-radial-gradient(circle,var(--w) 0 5px,var(--soft) 5px 6px);display:grid;place-items:center;animation:sp 9s linear infinite;animation-play-state:paused}
.disk.on{animation-play-state:running}
@keyframes sp{to{transform:rotate(360deg)}}
.lb{width:38%;aspect-ratio:1;border-radius:50%;border:2px solid var(--k);background:center/cover var(--soft);position:relative}
.lb:after{content:"";position:absolute;width:12px;height:12px;left:calc(50% - 8px);top:calc(50% - 8px);border-radius:50%;background:var(--w);border:2px solid var(--k)}
.meta{text-align:center;width:100%}.meta b{font-size:21px;display:block;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.pr{width:100%}.tm{display:flex;justify-content:space-between;color:var(--mut);font-size:14px;margin-top:6px}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:12px;border-radius:99px;border:2px solid var(--k);background:linear-gradient(var(--k),var(--k)) left/var(--p,0%) 100% no-repeat,var(--w)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:24px;height:24px;border-radius:50%;background:var(--k);border:3px solid var(--w);box-shadow:0 0 0 2px var(--k)}
input[type=range]::-moz-range-thumb{width:18px;height:18px;border-radius:50%;background:var(--k);border:3px solid var(--w);box-shadow:0 0 0 2px var(--k)}
.ct{display:grid;grid-template-columns:repeat(5,1fr);align-items:center;justify-items:center;width:100%}
.ct .ib{position:relative}.ct .ib small{position:absolute;right:6px;top:4px;font-size:11px;font-weight:800;color:inherit}
.ct .pl{width:72px;height:72px;background:var(--k);color:var(--w)}.pl .i{width:32px;height:32px}
.nx{display:flex;flex-direction:column;gap:10px;padding-top:8px}
#sh{position:absolute;inset:0;z-index:30;display:none}#sh.on{display:block}
.bd{position:absolute;inset:0;background:rgba(0,0,0,.45)}
.sp{position:absolute;left:0;right:0;bottom:0;max-height:75%;overflow:auto;background:var(--w);border-top:2px solid var(--k);border-radius:24px 24px 0 0;padding:18px 20px calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:10px}
.si{border:2px solid var(--k);border-radius:16px;padding:12px;text-align:center;font-weight:700}
.si small{font-weight:400}
.sp input{border:2px solid var(--k);border-radius:16px;padding:12px;background:var(--w);outline:0;text-align:center;width:100%}
#ts{position:absolute;left:50%;bottom:140px;transform:translateX(-50%);background:var(--k);color:var(--w);padding:8px 18px;border-radius:99px;font-weight:700;z-index:40;opacity:0;pointer-events:none;transition:opacity .2s;white-space:nowrap}
#ts.on{opacity:1}
#yt{position:fixed;right:0;bottom:0;width:1px;height:1px;opacity:.01;pointer-events:none}
</style>
</head>
<body>
<div class="app">
<header><button class="ib" data-a="th" id="thb"></button><div class="logo">HAMKER</div><button class="ib" data-a="add"></button></header>
<main id="m"></main>
<div id="mini"></div>
<nav><button data-a="tab" data-id="lib" id="n1"></button><button class="big" data-a="bp"></button><button data-a="tab" data-id="pl" id="n2"></button></nav>
<div class="pp" id="pp"></div>
<div id="sh"></div>
<div id="ts"></div>
</div>
<audio id="au" preload="auto"></audio><div id="yt"></div>
<input type="file" id="f" multiple accept="audio/*,.mp3" hidden>
<script>
const $=s=>document.querySelector(s),A=$('#au');
const I={play:'<path d="M8 5v14l11-7z" fill="currentColor"/>',pause:'<path d="M7 5h3v14H7zM14 5h3v14h-3z" fill="currentColor"/>',next:'<path d="M6 5v14l10-7z" fill="currentColor"/><path d="M19 5v14"/>',prev:'<path d="M18 5v14L8 12z" fill="currentColor"/><path d="M5 5v14"/>',shuf:'<path d="M16 3h5v5M4 20L21 3M21 16v5h-5M15 15l6 6M4 4l5 5"/>',rep:'<path d="M17 2l4 4-4 4M3 11V9a3 3 0 013-3h15M7 22l-4-4 4-4M21 13v2a3 3 0 01-3 3H3"/>',down:'<path d="M6 9l6 6 6-6"/>',up:'<path d="M6 15l6-6 6 6"/>',left:'<path d="M15 6l-6 6 6 6"/>',plus:'<path d="M12 5v14M5 12h14"/>',note:'<path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/>',list:'<path d="M4 6h16M4 12h16M4 18h10"/>',more:'<circle cx="5" cy="12" r="1.5" fill="currentColor"/><circle cx="12" cy="12" r="1.5" fill="currentColor"/><circle cx="19" cy="12" r="1.5" fill="currentColor"/>',x:'<path d="M6 6l12 12M18 6L6 18"/>',moon:'<path d="M21 12.8A9 9 0 1111.2 3a7 7 0 009.8 9.8z"/>'};
const ic=n=>`<svg class="i" viewBox="0 0 24 24">${I[n]}</svg>`;
const esc=s=>String(s).replace(/[&<>"']/g,c=>'&#'+c.charCodeAt(0)+';');
const uid=()=>Math.random().toString(36).slice(2,10);
const fm=s=>{s=s>0&&isFinite(s)?s|0:0;return(s/60|0)+':'+String(s%60).padStart(2,'0')};
const shuf=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
let S;try{S=JSON.parse(localStorage.getItem('hk'))}catch(e){}S=S||{songs:[],pls:[]};
const save=()=>localStorage.setItem('hk',JSON.stringify(S));
const db=new Promise(r=>{const q=indexedDB.open('hk',1);q.onupgradeneeded=()=>q.result.createObjectStore('b');q.onsuccess=()=>r(q.result)});
const idb=async(m,k,v)=>{const d=await db;return new Promise(r=>{const s=d.transaction('b',m==='get'?'readonly':'readwrite').objectStore('b');const q=m==='get'?s.get(k):m==='put'?s.put(v,k):s.delete(k);q.onsuccess=()=>r(q.result);q.onerror=()=>r()})};
const song=id=>S.songs.find(s=>s.id===id);
let view='lib',op=null,edit=false,cur=null,playing=false,eng='a',url,drag=false,YP,yp,SI=[],AC;
const Q={o:[],l:[],i:0,sh:false,rp:0};
const PL=()=>S.pls.find(p=>p.id===op);
const ids=()=>view==='plv'&&PL()?PL().ids:S.songs.map(s=>s.id);
let tt;const toast=m=>{const e=$('#ts');e.textContent=m;e.className='on';clearTimeout(tt);tt=setTimeout(()=>e.className='',1800)};

/* engine */
const ytInit=()=>yp||(yp=new Promise(r=>{window.onYouTubeIframeAPIReady=()=>{YP=new YT.Player('yt',{height:'1',width:'1',playerVars:{playsinline:1,controls:0},events:{onReady:()=>r(),onStateChange:e=>{if(eng!=='y')return;if(e.data===0)ended();else if(e.data===1)ps(1);else if(e.data===2)ps(0)}}})};const s=document.createElement('script');s.src='https://www.youtube.com/iframe_api';document.head.appendChild(s)}));
const T=()=>eng==='a'?A.currentTime:(YP&&YP.getCurrentTime?YP.getCurrentTime():0);
const D=()=>eng==='a'?A.duration||0:(YP&&YP.getDuration?YP.getDuration():0);
const seek=v=>eng==='a'?A.currentTime=v:YP&&YP.seekTo(v,true);
const pl=()=>eng==='a'?A.play().catch(()=>{}):YP&&YP.playVideo();
const pa=()=>eng==='a'?A.pause():YP&&YP.pauseVideo&&YP.pauseVideo();
const tg=()=>cur&&(playing?pa():pl());
A.onplay=()=>eng==='a'&&ps(1);A.onpause=()=>eng==='a'&&ps(0);A.onended=()=>eng==='a'&&ended();
function ps(b){playing=b;document.querySelectorAll('.pbi').forEach(e=>e.innerHTML=ic(b?'pause':'play'));const d=$('.disk');d&&d.classList.toggle('on',b);if('mediaSession'in navigator)navigator.mediaSession.playbackState=b?'playing':'paused'}
async function load(){const s=song(Q.l[Q.i]);if(!s)return;cur=s;A.pause();YP&&YP.pauseVideo&&YP.pauseVideo();
 if(s.t==='f'){const b=await idb('get',s.id);if(!b){toast('File missing');return}eng='a';if(url)URL.revokeObjectURL(url);url=URL.createObjectURL(b);A.src=url;A.play().catch(()=>{})}
 else{eng='y';await ytInit();YP.loadVideoById(s.yt)}
 if('mediaSession'in navigator)navigator.mediaSession.metadata=new MediaMetadata({title:s.title,artist:'Hamker',artwork:s.th?[{src:s.th,sizes:'480x360',type:'image/jpeg'}]:[]});
 pr();mini();render()}
function start(list,first,sh){list=list.filter(song);if(!list.length)return toast('No songs');first=first||(sh?list[Math.random()*list.length|0]:list[0]);Q.o=list;Q.sh=sh;Q.l=sh?[first,...shuf(list.filter(x=>x!==first))]:list;Q.i=Q.l.indexOf(first);load()}
function go(d){if(!Q.l.length)return;if(d<0&&T()>3)return seek(0);Q.i=(Q.i+d+Q.l.length)%Q.l.length;load()}
function ended(){if(Q.rp===2){seek(0);pl();return}if(Q.i<Q.l.length-1)return go(1);if(Q.rp===1){if(Q.sh)Q.l=shuf(Q.o);Q.i=0;load()}else{pa();seek(0)}}
if('mediaSession'in navigator){const m=navigator.mediaSession;[['play',pl],['pause',pa],['nexttrack',()=>go(1)],['previoustrack',()=>go(-1)],['seekto',d=>seek(d.seekTime)]].forEach(([a,f])=>{try{m.setActionHandler(a,f)}catch(e){}})}
setInterval(()=>{if(!cur)return;const t=T(),d=D(),p=d?t/d:0,k=$('#sk');if(k&&!drag){k.value=p*1000;k.style.setProperty('--p',p*100+'%');$('#t1').textContent=fm(t)}const b=$('#t2');if(b)b.textContent=fm(d);const m=$('#mp');if(m)m.style.width=p*100+'%'},400);

/* ui */
const row=(id,o={})=>{const s=song(id);return`<div class="row ${cur&&cur.id===id&&!o.q?'cur':''}" data-a="${o.q?'jq':'p'}" data-id="${id}" data-i="${o.i}"><div class="th" style="${s.th?`background-image:url('${s.th}')`:''}">${s.th?'':ic('note')}</div><div class="rt"><b>${esc(s.title)}</b><small>${s.t==='f'?'Local file':'YouTube'}</small></div>${o.edit?`<button class="ib" data-a="mv" data-i="${o.i}" data-d="-1">${ic('up')}</button><button class="ib" data-a="mv" data-i="${o.i}" data-d="1">${ic('down')}</button><button class="ib" data-a="rm" data-i="${o.i}">${ic('x')}</button>`:o.q?'':`<button class="ib" data-a="mn" data-id="${id}">${ic('more')}</button>`}</div>`};
function render(){const m=$('#m');
 $('#thb').innerHTML=ic('moon');document.querySelector('[data-a=add]').innerHTML=ic('plus');
 $('#n1').innerHTML=ic('note')+'Library';$('#n2').innerHTML=ic('list')+'Playlists';
 $('#n1').classList.toggle('on',view==='lib');$('#n2').classList.toggle('on',view!=='lib');
 document.querySelector('.big').innerHTML=ic('play');
 if(view==='lib')m.innerHTML=`<div class="tt">Library</div>`+(S.songs.length?S.songs.map((s,i)=>row(s.id,{i})).join(''):'<div class="st">No songs yet</div>');
 else if(view==='pl')m.innerHTML=`<div class="tt">Playlists</div><button class="btn" data-a="np">New playlist</button>`+(S.pls.length?S.pls.map(p=>`<div class="row" data-a="op" data-id="${p.id}"><div class="th">${ic('list')}</div><div class="rt"><b>${esc(p.name)}</b><small>${p.ids.length} songs</small></div></div>`).join(''):'<div class="st">No playlists yet</div>');
 else{const p=PL();if(!p){view='pl';return render()}m.innerHTML=`<div class="top"><button class="ib" data-a="bk">${ic('left')}</button><div class="tt">${esc(p.name)}</div><button class="ib" data-a="pm">${ic('more')}</button></div><div class="seg"><button data-a="p1">Play</button><button data-a="p2">Shuffle</button><button data-a="ed" class="${edit?'on':''}">Edit</button></div>`+(p.ids.length?p.ids.map((id,i)=>row(id,{edit,i})).join(''):'<div class="st">Empty playlist</div>')}
}
function mini(){const e=$('#mini');if(!cur){e.innerHTML='';return}e.innerHTML=`<div class="mini" data-a="po"><i id="mp"></i><div class="th" style="${cur.th?`background-image:url('${cur.th}')`:''}">${cur.th?'':ic('note')}</div><div class="rt"><b>${esc(cur.title)}</b></div><button class="ib pbi" data-a="tg"></button></div>`;ps(playing)}
function pr(){if(!cur)return;const nx=Q.l.slice(Q.i+1);$('#pp').innerHTML=`<div class="ph"><button class="ib" data-a="pc">${ic('down')}</button><span>Now playing</span><button class="ib" data-a="mn" data-id="${cur.id}">${ic('more')}</button></div><div class="sc"><div class="pg"><div class="disk ${playing?'on':''}"><div class="lb" style="${cur.th?`background-image:url('${cur.th}')`:''}"></div></div><div class="meta"><b>${esc(cur.title)}</b><small>${cur.t==='f'?'Local file':'YouTube'}</small></div><div class="pr"><input type="range" id="sk" min="0" max="1000" value="0"><div class="tm"><span id="t1">0:00</span><span id="t2">0:00</span></div></div><div class="ct"><button class="ib ${Q.sh?'on':''}" data-a="sf">${ic('shuf')}</button><button class="ib" data-a="pv">${ic('prev')}</button><button class="ib pl pbi" data-a="tg"></button><button class="ib" data-a="nx">${ic('next')}</button><button class="ib ${Q.rp?'on':''}" data-a="rp">${ic('rep')}${Q.rp===2?'<small>1</small>':''}</button></div></div><div class="nx"><div class="tt">Up next</div>${nx.length?nx.map((id,k)=>row(id,{q:1,i:Q.i+1+k})).join(''):'<div class="st">End of queue</div>'}</div></div>`;
 const k=$('#sk');k.oninput=()=>{drag=true;const p=k.value/1000;k.style.setProperty('--p',p*100+'%');$('#t1').textContent=fm(p*D())};k.onchange=()=>{seek(k.value/1000*D());drag=false};ps(playing)}
function sheet(title,items){const h=$('#sh');if(!items){h.className='';h.innerHTML='';return}SI=items;h.className='on';h.innerHTML=`<div class="bd" data-a="sx"></div><div class="sp"><div class="tt" style="font-size:20px">${esc(title)}</div>${items.map((x,i)=>`<button class="si" data-a="si" data-i="${i}">${esc(x.l)}${x.s?`<small>${esc(x.s)}</small>`:''}</button>`).join('')}</div>`}
function ask(title,ph,cb,val=''){const h=$('#sh');AC=cb;h.className='on';h.innerHTML=`<div class="bd" data-a="sx"></div><div class="sp"><div class="tt" style="font-size:20px">${esc(title)}</div><input id="ai" placeholder="${esc(ph)}" value="${esc(val)}"><button class="btn on" data-a="ok">Done</button></div>`;setTimeout(()=>$('#ai').focus(),50)}

/* data */
async function addYt(u){const m=u.match(/(?:v=|youtu\.be\/|embed\/|shorts\/|live\/)([\w-]{11})/);if(!m)return toast('Invalid link');const yt=m[1];if(S.songs.some(s=>s.yt===yt))return toast('Already added');toast('Fetching');let title='YouTube video';const w='https://www.youtube.com/watch?v='+yt;
 try{title=(await(await fetch('https://www.youtube.com/oembed?format=json&url='+encodeURIComponent(w))).json()).title}catch(e){try{title=(await(await fetch('https://noembed.com/embed?url='+encodeURIComponent(w))).json()).title||title}catch(e){}}
 S.songs.push({id:uid(),t:'y',yt,title,th:`https://i.ytimg.com/vi/${yt}/hqdefault.jpg`});save();render();toast('Added')}
$('#f').onchange=async e=>{for(const f of e.target.files){const id=uid();await idb('put',id,f);S.songs.push({id,t:'f',title:f.name.replace(/\.[^.]+$/,'')})}e.target.value='';save();render();toast('Added')};
function newPl(n,l=[]){const p={id:uid(),name:n,ids:l};S.pls.push(p);save();render();toast('Created')}
function addTo(id){sheet('Add to playlist',[...S.pls.map(p=>({l:p.name,s:p.ids.includes(id)?'Added':'',f:()=>{if(!p.ids.includes(id))p.ids.push(id);save();toast('Added')}})),{l:'New playlist',f:()=>ask('Playlist name','Name',n=>newPl(n,[id]))}])}
function del(id){S.songs=S.songs.filter(s=>s.id!==id);S.pls.forEach(p=>p.ids=p.ids.filter(x=>x!==id));idb('del',id);Q.o=Q.o.filter(x=>x!==id);Q.l=Q.l.filter(x=>x!==id);
 if(cur&&cur.id===id){pa();cur=null;playing=false;$('#pp').className='pp';$('#pp').innerHTML=''}save();mini();render()}
function songsSheet(){const p=PL();sheet('Add songs',S.songs.map(s=>({l:s.title,s:p.ids.includes(s.id)?'Added':'',keep:1,f:()=>{p.ids=p.ids.includes(s.id)?p.ids.filter(x=>x!==s.id):[...p.ids,s.id];save();render();songsSheet()}})))}

const X={
 th:()=>{const t=document.documentElement.dataset.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=t;try{localStorage.setItem('hk-theme',t)}catch(e){}},
 add:()=>sheet('Add songs',[{l:'Add mp3 files',f:()=>$('#f').click()},{l:'Paste YouTube link',f:()=>ask('YouTube link','https://',addYt)}]),
 tab:id=>{view=id;edit=false;render()},
 bp:()=>start(ids(),null,true),
 p:id=>start(ids(),id,Q.sh),
 jq:(id,i)=>{Q.i=i;load()},
 tg,nx:()=>go(1),pv:()=>go(-1),po:()=>{$('#pp').className='pp on'},pc:()=>{$('#pp').className='pp'},
 sf:()=>{const c=cur.id;Q.sh=!Q.sh;if(Q.sh){Q.l=[c,...shuf(Q.o.filter(x=>x!==c))];Q.i=0}else{Q.l=Q.o;Q.i=Math.max(0,Q.o.indexOf(c))}pr()},
 rp:()=>{Q.rp=(Q.rp+1)%3;pr()},
 np:()=>ask('Playlist name','Name',n=>newPl(n)),
 op:id=>{op=id;view='plv';edit=false;render()},

 ed:()=>{edit=!edit;render()},
 mv:(id,i,b)=>{const a=PL().ids,j=i+ +b.dataset.d;if(j<0||j>=a.length)return;[a[i],a[j]]=[a[j],a[i]];save();render()},
 rm:(id,i)=>{PL().ids.splice(i,1);save();render()},
 pm:()=>{const p=PL();sheet(p.name,[{l:'Add songs',f:songsSheet},{l:'Add another playlist',f:()=>sheet('Add playlist',S.pls.filter(x=>x.id!==p.id).map(x=>({l:x.name,s:x.ids.length+' songs',f:()=>{p.ids.push(...x.ids.filter(y=>!p.ids.includes(y)));save();render();toast('Added')}})))},{l:'Rename',f:()=>ask('Rename','Name',n=>{p.name=n;save();render()},p.name)},{l:'Delete playlist',f:()=>{S.pls=S.pls.filter(x=>x!==p);save();view='pl';render()}}])},
 mn:id=>{const s=song(id),it=[{l:'Add to playlist',f:()=>addTo(id)},{l:'Play next',f:()=>{if(!Q.l.length)return start([id],id,false);Q.l.splice(Q.i+1,0,id);Q.o.push(id);pr();toast('Queued')}}];
  if(view==='plv'&&PL().ids.includes(id))it.push({l:'Remove from playlist',f:()=>{PL().ids=PL().ids.filter(x=>x!==id);save();render()}});
  it.push({l:'Delete from library',f:()=>del(id)});sheet(s.title,it)},
 sx:()=>sheet(),
 si:(id,i)=>{const it=SI[i];if(!it.keep)sheet();it.f()},
 ok:()=>{const v=$('#ai').value.trim();sheet();if(v)AC(v)}
};
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b)return;const f=X[b.dataset.a];f&&f(b.dataset.id,+b.dataset.i,b)});
['copy','cut','contextmenu','selectstart','dragstart'].forEach(t=>document.addEventListener(t,e=>{if(!e.target.closest||!e.target.closest('input'))e.preventDefault()}));
